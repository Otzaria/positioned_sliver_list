name: Release Tag

# A commit on main whose message is only a version (for example "0.1.1") is
# tagged v0.1.1, and publish-pub-dev.yml is then dispatched on that tag.
#
# Why workflow_dispatch instead of relying on the tag push: a push made with
# GITHUB_TOKEN does not trigger other workflows. workflow_dispatch is the
# documented exception, and pub.dev automated publishing must allow
# workflow_dispatch events. The dispatched ref is the tag, so the OIDC claim
# matches the v{{version}} tag pattern.
on:
  push:
    branches:
      - main

permissions:
  # contents: push the tag. actions: dispatch the publish workflow.
  contents: write
  actions: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag version commits
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed to detect an existing tag for the same version.
          fetch-depth: 0

      - name: Detect a bare version commit
        id: check
        # The commit message is passed through an environment variable, not
        # interpolated into the script, so it cannot run commands.
        env:
          HEAD_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          subject="$(printf '%s' "$HEAD_MSG" | head -n 1 | tr -d '\r' \
            | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

          if ! printf '%s' "$subject" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.+-]+)?$'; then
            echo "The commit message is not a bare version (\"$subject\"); nothing to tag."
            echo "match=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [ "$subject" != "$pubspec_version" ]; then
            echo "::error::The commit message asks for $subject but pubspec.yaml has $pubspec_version. Update the version in the version commit itself."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$subject" >/dev/null; then
            echo "::error::Tag v$subject already exists; a published version cannot be published again."
            exit 1
          fi

          if ! grep -Fq "## $subject" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md has no section for $subject."
          fi

          echo "match=true" >> "$GITHUB_OUTPUT"
          echo "version=$subject" >> "$GITHUB_OUTPUT"

      - name: Push tag and start the publish run
        if: steps.check.outputs.match == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          set -euo pipefail

          # A lightweight tag needs no tagger identity.
          git tag "v$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/v$VERSION"

          gh workflow run publish-pub-dev.yml --ref "v$VERSION"

          echo "Pushed tag v$VERSION and started the pub.dev publish run." >> "$GITHUB_STEP_SUMMARY"
