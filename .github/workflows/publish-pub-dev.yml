name: Publish to pub.dev

# Runs for a version tag (release-tag.yml creates it from a commit whose
# message is only the version) and publishes through pub.dev automated
# publishing: authentication uses the run's OIDC token, so no pub.dev secret
# is stored here.
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

permissions:
  # id-token lets the run request its OIDC token.
  id-token: write
  contents: read

concurrency:
  group: publish-pub-dev-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: flutter pub publish
    runs-on: ubuntu-24.04
    # A failed authentication hangs instead of failing (pub waits for a
    # redirect that never comes), so limit the job.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Verify the tag matches pubspec version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pubspec_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1 | tr -d '\r')"
          if [ "$TAG" != "v$pubspec_version" ]; then
            echo "::error::Tag $TAG does not match version $pubspec_version in pubspec.yaml."
            exit 1
          fi
          echo "Publishing $pubspec_version." >> "$GITHUB_STEP_SUMMARY"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      # pub publish needs resolved dependencies, which fails for a Flutter
      # package under plain dart.
      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos lib test

      - name: flutter test (without perf benchmarks)
        run: flutter test --exclude-tags perf

      # Flutter's bundled pub does not exchange the OIDC token with pub.dev by
      # itself and falls back to interactive login, which waits until the run
      # is killed. Fetch the token and register it for pub.dev instead.
      - name: Authenticate to pub.dev with the run's OIDC token
        run: |
          set -euo pipefail

          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::The run has no OIDC token; permissions must include id-token: write."
            exit 1
          fi

          token="$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://pub.dev" \
            | jq -r '.value')"

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::Requesting the OIDC token failed."
            exit 1
          fi

          # Mask before any use so the token never reaches the log.
          echo "::add-mask::$token"
          echo "PUB_TOKEN=$token" >> "$GITHUB_ENV"

          dart pub token add https://pub.dev --env-var PUB_TOKEN

      - name: flutter pub publish --force
        run: flutter pub publish --force
