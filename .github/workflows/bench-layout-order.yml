name: Layout pass order benchmark

on:
  pull_request:
    paths:
      - 'lib/src/layout_pass.dart'
      - 'lib/src/render_object.dart'
      - 'test/layout_pass_order_test.dart'
      - 'test/perf/win23_layout_order_cache_perf_test.dart'
      - '.github/workflows/bench-layout-order.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    name: Multi-sliver layout pass ordering
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
      - name: flutter pub get
        run: flutter pub get
      - name: Verify layout correction ordering parity
        run: flutter test --reporter expanded test/layout_pass_order_test.dart
      - name: Compare O(n2) order scan to per-pass index map
        run: flutter test --reporter expanded --tags perf test/perf/win23_layout_order_cache_perf_test.dart
