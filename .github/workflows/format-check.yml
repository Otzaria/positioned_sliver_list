name: Format Check

# Runs for every push and pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: format-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-format:
    name: Dart format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.2"

      # pub get first: the formatter's style follows the language version the
      # resolution picks, so an unresolved tree formats differently.
      - name: flutter pub get
        run: flutter pub get

      - name: dart format --set-exit-if-changed
        run: dart format --output=none --set-exit-if-changed lib test example/lib

  line-endings:
    name: Line endings (no CRLF)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # Fails when a tracked text file contains CRLF, which publishing from a
      # Windows checkout can produce. *.bat and *.cmd need CRLF.
      - name: Check for CRLF in tracked text files
        run: |
          bad=$(git ls-files -- . ':!*.bat' ':!*.cmd' ':!*.png' ':!*.jar' \
            | while read -r f; do
                if grep -lIU "$(printf '\r')" "$f" >/dev/null 2>&1; then echo "$f"; fi
              done)
          if [ -n "$bad" ]; then
            echo "::error::These files contain CRLF line endings (convert them to LF):"
            echo "$bad"
            exit 1
          fi
          echo "OK: all files use LF."
