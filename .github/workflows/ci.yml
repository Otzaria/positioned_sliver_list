name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Analyze and test (${{ matrix.os }}, Flutter ${{ matrix.flutter }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
        flutter: ["3.47.2"]
        include:
          # Minimum supported Flutter (pubspec environment.flutter).
          - os: ubuntu-24.04
            flutter: "3.44.0"
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --fatal-infos lib test

      - name: flutter test
        run: flutter test --exclude-tags perf
