name: positioned_sliver_list
description: "Sliver list for very large lists with variable item extents: precise jump/animate to index, item position reporting, scroll anchoring, a real ScrollController, and a scrollable_positioned_list compatible API."
version: 0.1.0
homepage: https://github.com/Otzaria/positioned_sliver_list
repository: https://github.com/Otzaria/positioned_sliver_list
issue_tracker: https://github.com/Otzaria/positioned_sliver_list/issues
topics:
  - list
  - scrolling
  - sliver
  - widget

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.17.2
  logging: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.0.0
  test: ^1.24.9
  sliver_tools: ^0.2.12
  test_api:
  vm_service: ^15.2.0

flutter:
